<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16A8E3"/>
      <stop offset="100%" style="stop-color:#0ACFB1"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square -->
  <rect x="0" y="2" width="44" height="44" rx="10" fill="url(#iconGrad)"/>

  <!-- V chevron -->
  <polyline points="10,14 22,34 34,14"
            fill="none" stroke="white" stroke-width="4.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Three dots at V tips -->
  <circle cx="10" cy="14" r="2.8" fill="white" opacity="0.85"/>
  <circle cx="34" cy="14" r="2.8" fill="white" opacity="0.85"/>
  <circle cx="22" cy="34" r="2.8" fill="white" opacity="0.85"/>

  <!-- Vignan -->
  <text x="56" y="22"
        font-family="Poppins, Segoe UI, Arial, sans-serif"
        font-weight="800"
        font-size="19"
        fill="#1E293B"
        letter-spacing="-0.4">Vignan</text>

  <!-- TechSolutions -->
  <text x="56" y="40"
        font-family="Poppins, Segoe UI, Arial, sans-serif"
        font-weight="600"
        font-size="12"
        fill="#16A8E3"
        letter-spacing="1.2">TECHSOLUTIONS</text>
</svg>
