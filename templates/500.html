{% extends 'base.html' %}
{% block title %}500 — Server Error | Vignan TechSolutions{% endblock %}
{% block content %}
<section style="min-height:100vh;display:flex;align-items:center;background:linear-gradient(135deg,#0F172A 0%,#7F1D1D 50%,#0F172A 100%);position:relative;overflow:hidden">
    <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:48px 48px"></div>
    <div style="position:absolute;top:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(239,68,68,.2),transparent 70%)"></div>
    <div class="container text-center position-relative" style="z-index:1">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div style="font-family:'Poppins',sans-serif;font-size:clamp(6rem,15vw,10rem);font-weight:800;line-height:1;background:linear-gradient(135deg,rgba(239,68,68,.3),rgba(245,158,11,.2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:-1rem">500</div>
                <div style="font-size:4rem;margin-bottom:16px">⚙️</div>
                <h2 class="fw-800 text-white mb-3" style="font-size:clamp(1.5rem,3vw,2rem)">Server Error</h2>
                <p style="color:rgba(255,255,255,.65);font-size:1rem;line-height:1.8;max-width:420px;margin:0 auto 32px">
                    Something went wrong on our end. Our team has been notified and is working on a fix.
                </p>
                <div class="d-flex justify-content-center gap-3 flex-wrap">
                    <a href="/" class="btn btn-lg fw-700 rounded-pill px-5"
                       style="background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff;border:none;box-shadow:0 8px 24px rgba(239,68,68,.4)">
                        <i class="bi bi-house-fill me-2"></i>Go Home
                    </a>
                    <a href="javascript:location.reload()" class="btn btn-outline-light btn-lg rounded-pill px-5 fw-600">
                        <i class="bi bi-arrow-clockwise me-2"></i>Try Again
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
