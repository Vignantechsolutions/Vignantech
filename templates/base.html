<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1E3A8A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="{% block meta_description %}Vignan TechSolutions — MSME Registered Technology Company offering Internships, Courses, Corporate Training & Software Development in Hyderabad{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}internship hyderabad, python course, web development, corporate training, Vignan TechSolutions{% endblock %}">
    <meta name="author" content="Vignan TechSolutions">
    <meta property="og:title" content="{% block og_title %}Vignan TechSolutions{% endblock %}">
    <meta property="og:description" content="{% block og_description %}MSME Registered Technology Company — Internships, Courses & Corporate Training{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{% load static %}{% static 'images/vignan_logo.png' %}">
    <link rel="icon" type="image/png" href="{% static 'images/vignan_logo.png' %}">
    <title>{% block title %}Vignan TechSolutions{% endblock %} | Technology & Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>

{% include 'partials/navbar.html' %}

{% if messages %}
<div class="container" style="margin-top:1rem">
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-{% if message.tags == 'success' %}check-circle-fill{% elif message.tags == 'error' %}exclamation-circle-fill{% elif message.tags == 'warning' %}exclamation-triangle-fill{% else %}info-circle-fill{% endif %} flex-shrink-0"></i>
        <span>{{ message }}</span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
</div>
{% endif %}

<main>{% block content %}{% endblock %}</main>

{% include 'partials/footer.html' %}

<a href="https://wa.me/919876543210?text=Hello%20Vignan%20TechSolutions%2C%20I%20need%20more%20information" class="whatsapp-float" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
    <i class="bi bi-whatsapp"></i>
</a>
<button id="back-to-top" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="{% static 'js/main.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
